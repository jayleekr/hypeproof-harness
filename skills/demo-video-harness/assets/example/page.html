<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>acme-app</title>
<style>
  body {
    margin: 0; height: 100vh; display: flex; flex-direction: column;
    justify-content: center; align-items: center; gap: 24px;
    background: #0d1117; color: #e6edf3;
    font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif;
  }
  h1 { font-size: 48px; margin: 0; }
  #cta {
    font-size: 20px; padding: 14px 28px; border-radius: 8px; border: none;
    background: #ff5a63; color: white; cursor: pointer;
  }
  #detail {
    font-size: 20px; color: #8593a4; opacity: 0; transition: opacity .3s;
    max-width: 480px; text-align: center;
  }
  #detail.shown { opacity: 1; }
</style>
</head>
<body>
  <h1>acme-app</h1>
  <button id="cta">Run the thing</button>
  <p id="detail">Nice — this expanded inline, no page reload. Swap this
  page (or point <code>base_url</code> at your real app) to record your
  own demo.</p>
  <script>
    document.getElementById('cta').addEventListener('click', function () {
      document.getElementById('detail').classList.add('shown');
    });
  </script>
</body>
</html>
