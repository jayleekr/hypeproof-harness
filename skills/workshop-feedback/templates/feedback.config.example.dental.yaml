# workshop-feedback 엔지지먼트 config — 치과 원장 대상 강의 예시
# 이 파일은 소비 repo(lab)의 engagements/<name>/ 에 두고, 강의마다 이것만 바꾼다.
# 고정 코어(PC/AC/F)는 harness가 소유하므로 여기 없다 — 주제 슬롯만 정의.
#
# 대상: 치과 원장·실장·위생사(주로 40~60대). 정중한 존댓말, 진료실 현실 중심.
# "레이스/경쟁/점수" 같은 표현 금지 — 이건 강의다.

engagement: "치과 AI 활용 강의"
retention_months: 6

# 직군/역할 선택지 (사전 폼). 생략 시 플레이스홀더.
roles: ["원장", "실장·데스크", "위생사"]

# 주제 슬롯 — 강의별 교체 부분. 치과 원장의 실제 반복 업무 맥락.
topic:
  pre:
    q: "평소 반복해서 찾아보거나 확인하시는 일을 골라 주세요. (여러 개 선택 가능)"
    type: choice_multi
    options: ["초진 상담·치료계획 설명", "환자 문의·예약 응대", "보험청구·수가 확인",
              "재료·기공물 관리", "직원 교육·원내 매뉴얼", "블로그·홈페이지·마케팅 글", "리뷰·후기 응대", "기타"]
  post:
    q: "오늘 배운 것을 어느 업무에 먼저 적용해 보고 싶으신가요? (여러 개 선택 가능)"
    type: choice_multi
    options: ["초진 상담·치료계획 설명", "환자 문의·예약 응대", "보험청구·수가 확인",
              "재료·기공물 관리", "직원 교육·원내 매뉴얼", "블로그·홈페이지·마케팅 글", "리뷰·후기 응대", "아직 모르겠다"]
