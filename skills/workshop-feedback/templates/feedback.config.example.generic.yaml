# workshop-feedback 엔지지먼트 config — 범용 템플릿
# 아무 전문직 강의에도 재사용. 주제 슬롯 2개만 그 분야에 맞게 채우면 된다.

engagement: "<분야> AI 워크숍"      # 예: "세무사 AI 실무", "약국 응대 AI"
retention_months: 6

roles: ["__직군1__", "__직군2__"]   # 예: ["세무사", "사무직원"]

topic:
  pre:
    q: "<이 분야>에서 반복 검색/확인이 가장 잦은 상황은? (복수 가능)"
    type: choice_multi
    options: ["__상황A__", "__상황B__", "__상황C__", "기타"]
  post:
    q: "오늘 만든 도구를 어느 상황에 쓸 것 같나요?"
    type: choice
    options: ["__상황A__", "__상황B__", "__상황C__", "아직 모르겠다"]

# 선택 — 계속 쓸 의향 문항에서 부를 제품 이름 (생략 시 "오늘 쓰신 도구")
# product:
#   name: "제품명"
#   extra_features: ["이 강의에만 해당하는 기능 보기"]
