version: 1

repositories:
  - owner: jayleekr
    name: hypeproof-harness
    visibility: public
    profile: harness-core
    lifecycle: governance
    default_branch: main
    products: [governance]
    required_status_checks:
      - lint (bash -n + path hygiene)
      - gate (tests/run.sh against mock consumers)
      - "pr-policy (branch name + Closes #)"
      - repo-governance (policy validation)

  - owner: jayleekr
    name: hypeproof-studio
    visibility: public
    profile: public-product
    lifecycle: product
    default_branch: main
    products: [studio]
    required_status_checks:
      - repo-governance (repo files)
      - worker / test
      - worker / typecheck
      - extension / typecheck
    required_secrets:
      actions:
        - ANTHROPIC_API_KEY
        - DISCORD_WEBHOOK_HYPEPROOF_STUDIO
        - DISCORD_WEBHOOK_SEDIMENT
    release_repos:
      - jayleekr/hypeproof-studio-releases

  - owner: jayleekr
    name: sediment
    visibility: public
    profile: public-product
    lifecycle: product
    default_branch: main
    products: [sediment]
    required_status_checks:
      - repo-governance (repo files)
      - Rust CLI unit + edges
      - Backend + shim + rate-limit UT
      - Cross-tenant RLS gate (blocks merge)
      - Lint :NAME::TYPE SQL cast
      - Scan PR diff for secrets / credentials / private keys
      - Python smoke tests (JWT, fixer 4-tier, search_utils, chunker, ...)
    required_secrets:
      actions:
        - FLY_API_TOKEN
        - VERCEL_TOKEN
        - VERCEL_ORG_ID
        - VERCEL_PROJECT_ID
        - DISCORD_WEBHOOK_SEDIMENT
        - RELEASE_MIRROR_TOKEN
    release_repos:
      - jayleekr/sediment-cli-releases
      - jayleekr/homebrew-sediment

  - owner: jayleekr
    name: hypeprooflab
    visibility: private
    # ========================= HOLD — DO NOT FLIP =========================
    # `target_visibility: public` records the eventual GOAL. It is NOT an
    # instruction, NOT a queued action, and NOT clearance.
    #
    # Nothing in this harness acts on it. Verified consumers of the key:
    #   - scripts/repo-governance/audit.py:119-137 (validate_policy) — the only
    #     semantic consumer: enum-checks the value and, when it differs from
    #     `visibility`, REQUIRES a non-empty `public_readiness.blocked_by` and
    #     the `temporary-private-until-oauth-purge` exception.
    #   - tests/repo_governance/test_policy.py:53-57 — pins this exact state.
    #   - docs/REPO-GOVERNANCE.ko.md "Public Readiness Holds" — the convention.
    #   - apply.py NEVER sends `visibility`/`private` to the GitHub API, and the
    #     live audit compares only `visibility` (audit.py:235). No automation can
    #     flip this repo.
    # So the only path to public is a human — or an agent following
    # skills/hypeproof-operator — running `gh repo edit --visibility public`
    # because this field said "public". That is the risk this comment exists to
    # stop.
    #
    # Going public publishes the ENTIRE origin/main history, not just HEAD, and
    # is IRREVERSIBLE: clones, forks, and search/LLM caches survive any revert.
    # That history is NOT cleared. Prerequisites, in order: third-party
    # confidentiality clearance, then the coordinated history purge. See
    # TENANT-BOUNDARY-v0.1.md — finding B-7, remediation P-1-4 (this hold),
    # P-1-3 (clearance), P-1-8 (purge). Purge before clearance destroys the
    # forensic record; do not reorder them.
    #
    # HOW TO EXPRESS THE HOLD — the enforced part is `public_readiness.blocked_by`
    # below, not this comment. Do NOT invent a `target_visibility` value: the enum
    # is public/private/internal only, so `held`/`blocked`/anything else is a
    # CRITICAL policy error that makes `apply.py` exit 4 and fails the daily
    # governance audit. That is a broken pipeline, not a hold.
    # Equally, do NOT "quiet" this by deleting `target_visibility` or setting it
    # to `private`: both make `target_visibility == visibility`, which switches
    # off the blocked_by and exception requirements entirely (verified: 0
    # findings) and silently retires the record of the hold.
    # Clearing a blocker means closing it in reality, not deleting the line.
    # ======================================================================
    target_visibility: public
    profile: content-vault
    lifecycle: product
    default_branch: main
    products: [lab, vault]
    deployment:
      production_authority: github-actions
      workflow: .github/workflows/ci.yml
      job: deploy
      provider: vercel
      provider_git_auto_deploy: disabled
      provider_config: vercel.json
    public_readiness:
      blocked_by:
        - issue: jayleekr/hypeprooflab#96
          reason: Rotate/revoke the exposed Google OAuth client secret and verify the historical commit is no longer fetchable by SHA.
        - issue: jayleekr/hypeprooflab#100
          reason: Complete tracked text/PDF/image PII sweep before making the content repo public again.
        # Deliberately NOT filed as a GitHub issue in hypeprooflab: a tracker
        # entry describing what is in the history is itself an unpurgeable
        # disclosure to that repo's non-employee collaborators, and no git
        # operation removes an issue. Tracked in this policy file and in the
        # offline decision record instead. Closing #96 and #100 does NOT clear
        # this item — it is separate work with a separate approver.
        - issue: jayleekr/hypeproof-harness#98
          reason: >-
            HELD pending third-party confidentiality clearance and the coordinated
            history purge. HEAD cleanliness is not sufficient — a public flip
            exposes the full origin/main history and cannot be undone. Sequence and
            scope are in TENANT-BOUNDARY-v0.1.md (B-7; P-1-3 clearance, then P-1-8
            purge). Requires a named human approver, not a passing CI run.
      verifier:
        pr: jayleekr/hypeprooflab#120
        workflow: OAuth purge verification
    required_status_checks:
      # Context strings MUST equal what GitHub actually reports: the job `name:`
      # if set, otherwise the bare job-id — there is NO "<workflow> / <job>"
      # prefix (verified against live harness protection). apply.py PUTs these
      # verbatim as branch-protection contexts, so a name no workflow produces
      # locks merge forever. Validate with:
      #   scripts/repo-governance/check_required_contexts.py --repo jayleekr/hypeprooflab --root <checkout>
      - repo-governance (repo files)   # repo-governance.yml job "repo-files" sets this name
      - build                          # ci.yml job "build" has no name: -> context is bare "build"
      # DELIBERATELY NOT REQUIRED YET — member verification:
      #   ci.yml's smoke job AND verify-members.yml's job BOTH resolve to the
      #   context "verify" (neither sets a distinct name:), so requiring "verify"
      #   is ambiguous. FIRST give each a distinct `name:` in hypeprooflab
      #   (e.g. verify-members.yml job -> name: "Verify Members in Build";
      #   ci.yml verify job -> name: "Post-deploy smoke"), let them run green
      #   once, THEN add the new context strings here.
    required_secrets:
      actions:
        - VERCEL_TOKEN
        - SEDIMENT_INGEST_URL
        - SEDIMENT_WEBHOOK_SECRET
        - DISCORD_WEBHOOK_HYPEPROOFLAB_PAGE
        - DISCORD_WEBHOOK_SEDIMENT
    exceptions:
      - id: lab-public-readiness-oauth-history-purge
        owner: jayleekr
        reason: Keep private until hypeprooflab#96 confirms Google OAuth secret rotation and GitHub historical commit purge.
        expires_at: 2026-12-31
      - id: lab-public-readiness-pii-sweep
        owner: jayleekr
        reason: Keep private until hypeprooflab#100 confirms current-tree PII/email cleanup.
        expires_at: 2026-12-31
      - id: temporary-private-until-oauth-purge
        owner: jayleekr
        # NOTE: audit.py:126-137 hard-requires THIS id whenever
        # target_visibility differs from visibility. It expires 2026-08-31, which
        # will make the whole policy invalid (expired-exception finding -> apply.py
        # exit 4 -> red governance audit). That failure is fail-closed and must be
        # resolved by re-dating this exception after review, NOT by removing
        # target_visibility and NOT by flipping visibility to public.
        reason: Target visibility is public, but the repo must remain private until the exposed OAuth credential is rotated and the historical commit purge verifier passes.
        expires_at: 2026-08-31
      - id: lab-public-readiness-tenant-history-clearance
        owner: jayleekr
        reason: >-
          Keep private until third-party confidentiality clearance and the
          coordinated history purge are both complete (TENANT-BOUNDARY-v0.1.md
          B-7, P-1-3, P-1-8). Expiry is a re-review trigger only — reaching
          expires_at is NOT clearance and must never be read as one.
        expires_at: 2026-12-31
      - id: private-branch-protection-plan-limit
        owner: jayleekr
        reason: Personal private repo branch protection requires GitHub Pro/Team or Organization before hard enforcement.
        expires_at: 2026-12-31
      - id: private-forking-api-limit
        owner: jayleekr
        reason: GitHub only exposes allow_forking mutation for org-owned private repositories.
        expires_at: 2026-12-31
      - id: private-secret-scanning-api-limit
        owner: jayleekr
        reason: Personal private repo security_and_analysis API is unavailable until GitHub Pro/Team or org migration.
        expires_at: 2026-12-31
  - owner: jayleekr
    name: jayleekr.github.io
    visibility: public
    profile: public-site
    lifecycle: site
    default_branch: master
    protected_branch: master
    products: [personal-site]
    required_status_checks: []
    exceptions:
      - id: github-io-ci-not-yet-created
        owner: jayleekr
        reason: Add stable PR checks before requiring named status contexts.
        expires_at: 2026-08-31

  - owner: jayleekr
    name: hypeproof-studio-releases
    visibility: public
    profile: release-artifact
    lifecycle: release
    default_branch: main
    products: [studio]
    source_repo: jayleekr/hypeproof-studio

  - owner: jayleekr
    name: sediment-cli-releases
    visibility: public
    profile: release-artifact
    lifecycle: release
    default_branch: main
    products: [sediment]
    source_repo: jayleekr/sediment

  - owner: jayleekr
    name: homebrew-sediment
    visibility: public
    profile: release-artifact
    lifecycle: release
    default_branch: main
    products: [sediment]
    source_repo: jayleekr/sediment
