name: Change impact

on:
  workflow_call:
    inputs:
      apply:
        type: boolean
        default: false
      operational_smoke:
        type: boolean
        default: false
    secrets:
      HYPEPROOF_GOVERNANCE_TOKEN:
        required: true
      ANTHROPIC_API_KEY:
        required: true
  workflow_dispatch:
    inputs:
      apply:
        description: Synchronize main review issues and advisory PR comments
        type: boolean
        default: false

      operational_smoke:
        description: Verify actual source reads and issue write/retry/cleanup before scanning
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: change-impact-single-writer
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: jayleekr/hypeproof-harness
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet pyyaml
      - name: Verify deployed credentials and API behavior
        if: inputs.operational_smoke
        env:
          GH_TOKEN: ${{ secrets.HYPEPROOF_GOVERNANCE_TOKEN }}
          CHANGE_IMPACT_SOURCE_REPO: ${{ github.repository }}
          CHANGE_IMPACT_SOURCE_TOKEN: ${{ github.token }}
        run: python scripts/change-impact/ops_smoke.py
      - name: Review adopted changes using trusted main code
        env:
          GH_TOKEN: ${{ secrets.HYPEPROOF_GOVERNANCE_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CHANGE_IMPACT_SOURCE_REPO: ${{ github.repository }}
          CHANGE_IMPACT_SOURCE_TOKEN: ${{ github.token }}
          APPLY: ${{ github.event_name == 'schedule' || inputs.apply }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN" || { echo 'Cross-repo token not configured; review cannot run.'; exit 1; }
          scan_args=()
          if [ "$APPLY" = true ]; then
            scan_args+=(--apply)
          fi
          python scripts/change-impact/impact.py scan --reason "${scan_args[@]}" --output impact-report.json
      - name: Advisory PR reports
        if: always()
        env:
          GH_TOKEN: ${{ secrets.HYPEPROOF_GOVERNANCE_TOKEN }}
          CHANGE_IMPACT_SOURCE_REPO: ${{ github.repository }}
          CHANGE_IMPACT_SOURCE_TOKEN: ${{ github.token }}
          APPLY: ${{ github.event_name == 'schedule' || inputs.apply }}
        run: |
          set -euo pipefail
          args=()
          if [ "$APPLY" = true ]; then args+=(--publish-reports); fi
          python scripts/change-impact/impact.py prs "${args[@]}" --output impact-prs.json
      - name: Report adoption status separately from successful processing
        if: always()
        env:
          GH_TOKEN: ${{ secrets.HYPEPROOF_GOVERNANCE_TOKEN }}
          CHANGE_IMPACT_SOURCE_REPO: ${{ github.repository }}
          CHANGE_IMPACT_SOURCE_TOKEN: ${{ github.token }}
        run: |
          set +e
          python scripts/change-impact/impact.py status --output impact-status.json
          result=$?
          if [ "$result" -gt 1 ]; then exit "$result"; fi
          python - <<'PY'
          import json, os
          from pathlib import Path
          report = json.loads(Path('impact-status.json').read_text())
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write('## Change adoption\n\n')
              out.write(f"Complete: {report['complete']}\n\n")
              for url in report['pending_reviews']:
                  out.write(f'- Pending review: {url}\n')
              out.write(f"\nMissing review records: {len(report['missing_reviews'])}\n")
              out.write(f"\nStructural gaps: {len(report['structural_gaps'])}\n")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: change-impact-reports
          path: impact-*.json
          if-no-files-found: warn
          retention-days: 14
